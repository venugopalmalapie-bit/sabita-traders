<style>
:root{--green:#367C2B;--yellow:#FFDE00;--ink:#27251F;--deep:#1E6B1E;--muted-bg:#F4F5F0;--muted:#5C5A52;--border:#D9DACF;--wa:#177A42;--error:#B42318;--tint:#EAF2E7;--warn-bg:#FDECEA;
  --sans:"Noto Sans",Arial,sans-serif;--odia:"Noto Sans Oriya","Noto Sans",Arial,sans-serif;--display:Oswald,"Roboto Condensed",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--muted-bg);color:var(--ink);font:16px/1.5 var(--sans)}
body.or{font-family:var(--odia)}
body.or .card h2,body.or .hero h1{font-family:var(--odia);font-weight:700}
.langbar{display:grid;grid-template-columns:repeat(2,1fr);background:#3A3832;border-bottom:1px solid #5C5A52}
.langbar button{min-height:48px;border:0;border-right:1px solid #5C5A52;background:transparent;color:#fff;font:600 16px/1.2 var(--sans);cursor:pointer}
.langbar button:last-child{border-right:0}
.langbar button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.langbar .l-or{font-family:var(--odia)}
.wrap{max-width:620px;margin:0 auto;min-height:100vh;background:var(--muted-bg);display:flex;flex-direction:column}
header{background:var(--ink);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:700 22px/26px var(--display)}
.sub{font-size:13px;color:#D9DACF}
.lang{display:flex;border:1px solid #5C5A52;border-radius:6px;overflow:hidden;flex:none}
.lang button{height:44px;min-width:56px;padding:0 10px;border:0;background:transparent;color:#fff;font:600 15px var(--sans);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.lang button.or{font-family:var(--odia)}
.rule{height:4px;background:var(--yellow)}
main{padding:16px;display:flex;flex-direction:column;gap:16px;flex:1}
.hero h1{margin:0 0 4px;font:700 24px/1.3 var(--display)}
.hero p{margin:0;color:var(--muted);font-size:15px}
.card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font:600 19px/1.35 var(--display)}
.hint{margin:0;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:8px 14px;border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--ink);font:600 15px/1.3 inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border:2px solid var(--green);background:var(--tint);color:var(--deep)}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:700}
.aspect{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.aspect:first-of-type{border-top:0;padding-top:0}
.aspect .q{font-weight:600;font-size:15px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{min-height:48px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);font:600 15px/1.2 inherit;font-family:inherit;cursor:pointer;padding:6px}
.rate button[aria-pressed="true"][data-v="good"]{border:2px solid var(--green);background:var(--tint);color:var(--deep)}
.rate button[aria-pressed="true"][data-v="ok"]{border:2px solid #8A6D00;background:#FFF7CC;color:#5A4700}
.rate button[aria-pressed="true"][data-v="bad"]{border:2px solid var(--error);background:var(--warn-bg);color:var(--error)}
.empty-note{font-size:14px;color:var(--muted);background:var(--muted-bg);border-radius:6px;padding:10px}
textarea{width:100%;min-height:120px;border:1px solid var(--border);border-radius:6px;padding:12px;font:16px/1.6 inherit;font-family:inherit;color:var(--ink);resize:vertical}
textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#review{min-height:170px;background:#FFFEF5}
@keyframes pulse{50%{opacity:.35}}
.live{font-size:14px;color:var(--muted);font-style:italic;min-height:0}
.live:empty{display:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.small{font-size:13px;color:var(--muted)}
.btn{min-height:52px;border-radius:8px;font:700 17px/1.2 inherit;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:10px 16px;text-align:center}
.btn-yellow{border:0;background:var(--yellow);color:var(--ink)}
.btn-green{border:0;background:var(--green);color:#fff}
.btn-outline{border:1px solid var(--green);background:#fff;color:var(--green)}
.btn-plain{border:1px solid var(--border);background:#fff;color:var(--ink);font-size:15px;min-height:44px}
.btn[aria-disabled="true"]{opacity:.5}
.steps{margin:0;padding-left:20px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.help{background:var(--warn-bg);border:1px solid #F3C1BB;border-radius:8px;padding:14px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.help b{font-size:17px}
.help a{color:var(--error);font-weight:700}
.status{font-size:14px;font-weight:600;color:var(--deep);min-height:20px}
.status.err{color:var(--error)}
footer{background:var(--deep);color:#fff;padding:14px 16px;font-size:13px;line-height:1.5}
footer a{color:#fff}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.face{min-height:100px;border:1px solid var(--border);border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:700 16px/1.2 inherit;font-family:inherit;color:var(--ink);cursor:pointer;padding:8px 4px}
.face[aria-pressed="true"][data-v="good"]{border:2px solid var(--green);background:var(--tint);color:var(--deep)}
.face[aria-pressed="true"][data-v="ok"]{border:2px solid #8A6D00;background:#FFF7CC;color:#5A4700}
.face[aria-pressed="true"][data-v="bad"]{border:2px solid var(--error);background:var(--warn-bg);color:var(--error)}
.jump{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--tint);border-radius:8px;padding:10px 12px;font-size:15px;font-weight:600;color:var(--deep)}
.jump a{color:var(--deep)}
.btn-big{min-height:62px;font-size:19px;border-radius:12px}
.link{background:none;border:0;padding:10px 0;color:var(--green);font:600 15px/1.2 inherit;font-family:inherit;text-decoration:underline;cursor:pointer;align-self:center;min-height:44px}
/* ---- desktop: questions left, live review right (sticky) ---- */
@media (min-width:960px){
  html,body{background:#E7E8E1}
  .wrap{max-width:1180px;box-shadow:0 0 0 1px var(--border)}
  main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:20px 28px;align-items:start;padding:24px}
  main>.hero{grid-column:1/-1}
  main>section.card:not([aria-labelledby="h4"]){grid-column:1}
  main>section[aria-labelledby="h4"]{grid-column:2;grid-row:2/span 4;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
  main>#help{grid-column:2}
  main>#reset{grid-column:1;justify-self:start;min-width:220px}
  #jump{display:none!important}
  .faces .face{min-height:110px}
}
.langbar.lang{display:grid;border:0;border-radius:0;overflow:visible}
[hidden]{display:none!important}
</style>

      helpBody: "ଦୟାକରି ଆପଣଙ୍କ ସଚ୍ଚା ରିଭ୍ୟୁ ପୋଷ୍ଟ କରନ୍ତୁ। ସମସ୍ୟା ସମାଧାନ ପାଇଁ ଆମ ଟିମକୁ କଲ୍ କିମ୍ବା WhatsApp କରନ୍ତୁ:",
      reset: "ପୁଣି ଆରମ୍ଭ କରନ୍ତୁ",
      foot1: "ଆପଣଙ୍କ ରିଭ୍ୟୁ ଆପଣଙ୍କର। ଭଲ କି ଖରାପ ରିଭ୍ୟୁ ପାଇଁ ସବିତା ଟ୍ରେଡର୍ସ କୌଣସି ପୁରସ୍କାର ଦିଏ ନାହିଁ।",
      foot2: "ଆପଣଙ୍କ ରିଭ୍ୟୁ ଲେଖା ସେଭ୍ ହୁଏ ନାହିଁ କି ଆମକୁ ପଠାଯାଏ ନାହିଁ। ଆମେ କେବଳ ଏହି ପୃଷ୍ଠାର ଭିଜିଟ୍ ଗଣନା କରୁ।",
      good: "ଭଲ", ok: "ଠିକ୍ ଅଛି", bad: "ଭଲ ନୁହେଁ", wordsPh: "ଯେପରି: କ'ଣ ଭଲ ଲାଗିଲା, କ'ଣ ଭୁଲ ହେଲା…",
      noAspects: "ଏହି ପ୍ରଶ୍ନ ଦେଖିବାକୁ ୧ମ କିମ୍ବା ୨ୟ ଧାପରେ ଉତ୍ତର ଟାପ୍ କରନ୍ତୁ।",
      overallOnly: { good: "ସବିତା ଟ୍ରେଡର୍ସରେ ମୋର ଅନୁଭୂତି ଭଲ ଥିଲା।", ok: "ସବିତା ଟ୍ରେଡର୍ସରେ ମୋର ଅନୁଭୂତି ଠିକ୍ ଥିଲା।", bad: "ସବିତା ଟ୍ରେଡର୍ସରେ ମୋର ଅନୁଭୂତି ଭଲ ନଥିଲା।" },
      what: { tractor: "ନୂଆ ଟ୍ରାକ୍ଟର", implement: "ଯନ୍ତ୍ରପାତି", parts: "ସ୍ପେୟାର ପାର୍ଟସ", service: "ଟ୍ରାକ୍ଟର ସର୍ଭିସ / ମରାମତି", loan: "ଲୋନ୍ ସହାୟତା", subsidy: "ସବସିଡି ସହାୟତା" },
      aspects: {
        overall: "ସମୁଦାୟ ଅନୁଭୂତି", staff: "କର୍ମଚାରୀଙ୍କ ବ୍ୟବହାର", explain: "ମୂଲ୍ୟ ଓ ବିଶେଷତା ବୁଝାଇବା",
        delivery: "ଡେଲିଭରି ସମୟ", paperwork: "କାଗଜପତ୍ରରେ ସହାୟତା", servicework: "ସର୍ଭିସ କାମର ମାନ",
        servicetime: "ସର୍ଭିସରେ ଲାଗିଥିବା ସମୟ", partsavail: "ସ୍ପେୟାର ପାର୍ଟସର ଉପଲବ୍ଧତା"
      },
      rated: { good: "ଭଲ ଥିଲା।", ok: "ଠିକ୍ ଥିଲା।", bad: "ଭଲ ନଥିଲା।" }
    }
  };

  var WHAT = ["tractor", "implement", "parts", "service", "loan", "subsidy"];
  // which questions appear for which selections (overall + staff always)
  var ASPECT_FOR = {
    overall: null, staff: null,
    explain: ["tractor", "implement"],
    delivery: ["tractor", "implement"],
    paperwork: ["tractor", "loan", "subsidy"],
    servicework: ["service"],
    servicetime: ["service"],
    partsavail: ["parts", "service"]
  };
  var ASPECT_ORDER = ["staff", "explain", "delivery", "paperwork", "servicework", "servicetime", "partsavail"];

  var state = { lang: "or", overall: null, what: {}, rate: {}, edited: false };
  var $ = function (id) { return document.getElementById(id); };
  var reviewBox = $("review"), wordsBox = $("words");

  function t(k) { return T[state.lang][k]; }
  // Analytics: counts only. Never sends the review text, names or phone numbers.
  function track(name, params) {
    try { if (typeof gtag === "function") gtag("event", name, Object.assign({ page: "Review tool", page_type: "tool", lang: state.lang }, params || {})); } catch (e) {}
  }

  /* ---------- sentence building (only from what the customer chose or wrote) ---------- */
  function joinList(items, lang) {
    if (items.length <= 1) return items.join("");
    var and = { en: " and ", or: " ଓ " }[lang];
    return items.slice(0, -1).join(", ") + and + items[items.length - 1];
  }
  function introSentences(lang) {
    var s = [], bought = [], w = state.what;
    if (lang === "en") {
      if (w.tractor) bought.push("a new tractor");
      if (w.implement) bought.push("an implement");
      if (w.parts) bought.push("spare parts");
      if (bought.length) s.push("I bought " + joinList(bought, lang) + " from Sabita Traders.");
      if (w.service) s.push(bought.length ? "I also got my tractor serviced here." : "I got my tractor serviced at Sabita Traders.");
      var help = [];
      if (w.loan) help.push("the loan");
      if (w.subsidy) help.push("the subsidy application");
      if (help.length) s.push((s.length ? "I also needed help with " : "I needed help from Sabita Traders with ") + joinList(help, lang) + ".");
    } else {
      if (w.tractor) bought.push("ନୂଆ ଟ୍ରାକ୍ଟର");
      if (w.implement) bought.push("ଯନ୍ତ୍ରପାତି");
      if (w.parts) bought.push("ସ୍ପେୟାର ପାର୍ଟସ");
      if (bought.length) s.push("ମୁଁ ସବିତା ଟ୍ରେଡର୍ସରୁ " + joinList(bought, lang) + " କିଣିଲି।");
      if (w.service) s.push(bought.length ? "ମୁଁ ଏଠାରେ ମୋ ଟ୍ରାକ୍ଟର ସର୍ଭିସ ମଧ୍ୟ କରାଇଲି।" : "ମୁଁ ସବିତା ଟ୍ରେଡର୍ସରେ ମୋ ଟ୍ରାକ୍ଟର ସର୍ଭିସ କରାଇଲି।");
      var helpO = [];
      if (w.loan) helpO.push("ଲୋନ୍");
      if (w.subsidy) helpO.push("ସବସିଡି ଆବେଦନ");
      if (helpO.length) s.push((s.length ? "ମୋତେ " : "ମୋତେ ସବିତା ଟ୍ରେଡର୍ସରୁ ") + joinList(helpO, lang) + " ପାଇଁ " + (s.length ? "ମଧ୍ୟ " : "") + "ସହାୟତା ଦରକାର ଥିଲା।");
    }
    return s;
  }
  function visibleAspects() {
    return ASPECT_ORDER.filter(function (a) {
      var need = ASPECT_FOR[a];
      if (!need) return Object.keys(state.what).length > 0 || !!state.overall;
      return need.some(function (w) { return state.what[w]; });
    });
  }
  function buildReview(lang) {
    var L = T[lang], out = introSentences(lang);
    if (state.overall) out.push(out.length ? L.aspects.overall + " " + L.rated[state.overall] : L.overallOnly[state.overall]);
    visibleAspects().forEach(function (a) {
      var v = state.rate[a]; if (!v) return;
      out.push(L.aspects[a] + " " + L.rated[v]);
    });
    var own = wordsBox.value.trim();
    if (own) out.push(own);
    return out.join(" ");
  }
  function anyBad() { return state.overall === "bad" || visibleAspects().some(function (a) { return state.rate[a] === "bad"; }); }


  var FACE_SVG = {
    good: '<path d="M12 24c4 5 12 5 16 0"/>', ok: '<path d="M13 26h14"/>', bad: '<path d="M12 28c4-5 12-5 16 0"/>'
  };
  var FACE_COLOR = { good: "#367C2B", ok: "#8A6D00", bad: "#B42318" };
  function renderFaces() {
    $("faces").innerHTML = ["good", "ok", "bad"].map(function (v) {
      var c = FACE_COLOR[v];
      return '<button type="button" class="face" data-v="' + v + '" aria-pressed="' + (state.overall === v) + '">' +
        '<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="' + c + '" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="20" cy="20" r="17"/><circle cx="14" cy="16" r="1.5" fill="' + c + '"/><circle cx="26" cy="16" r="1.5" fill="' + c + '"/>' + FACE_SVG[v] + "</svg>" +
        "<span>" + t(v) + "</span></button>";
    }).join("");
    $("jump").hidden = !state.overall;
  }
  /* ---------- rendering ---------- */
  function renderWhat() {
    $("what").innerHTML = WHAT.map(function (k) {
      return '<button type="button" class="chip" data-what="' + k + '" aria-pressed="' + (!!state.what[k]) + '">' + t("what")[k] + "</button>";
    }).join("");
  }
  function renderAspects() {
    var list = visibleAspects();
    if (!list.length) { $("aspects").innerHTML = '<div class="empty-note">' + t("noAspects") + "</div>"; return; }
    $("aspects").innerHTML = list.map(function (a) {
      var v = state.rate[a];
      return '<div class="aspect" role="group" aria-label="' + t("aspects")[a] + '"><div class="q">' + t("aspects")[a] + '</div><div class="rate">' +
        ["good", "ok", "bad"].map(function (x) {
          return '<button type="button" data-aspect="' + a + '" data-v="' + x + '" aria-pressed="' + (v === x) + '">' + t(x) + "</button>";
        }).join("") + "</div></div>";
    }).join("");
  }
  function updateReview() {
    if (!state.edited) reviewBox.value = buildReview(state.lang);
    $("edited-note").hidden = !state.edited;
    $("rebuild").hidden = !state.edited;
    $("help").hidden = !anyBad();
    var empty = !reviewBox.value.trim();
    $("copy").setAttribute("aria-disabled", empty ? "true" : "false");
    $("post").setAttribute("aria-disabled", empty ? "true" : "false");
  }
  function renderText() {
    document.documentElement.lang = state.lang;
    document.body.className = state.lang === "en" ? "" : state.lang;
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t(el.getAttribute("data-t")); });
    document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)); });
    wordsBox.placeholder = t("wordsPh");
    reviewBox.placeholder = t("emptyReview");
  }
  function setStatus(msg, err) { var s = $("status"); s.textContent = msg; s.className = "status" + (err ? " err" : ""); }
  function renderAll() { renderText(); renderFaces(); renderWhat(); renderAspects(); updateReview(); }

  /* ---------- events ---------- */
  document.querySelector(".lang").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]"); if (!b) return;
    state.lang = b.dataset.lang; setStatus(""); renderAll();
    track("language_switch", { to: state.lang });
  });
  $("faces").addEventListener("click", function (e) {
    var b = e.target.closest(".face"); if (!b) return;
    state.overall = state.overall === b.dataset.v ? null : b.dataset.v;   // tap again to clear
    if (state.overall) track("review_overall", { rating: state.overall });
    renderFaces(); renderAspects(); updateReview(); setStatus("");
  });
  $("jump-link").addEventListener("click", function (e) {
    e.preventDefault(); $("h4").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  // One button: copy the review, then let the link open Google.
  $("post").addEventListener("click", function (e) {
    var text = reviewBox.value.trim();
    if (!text) { e.preventDefault(); setStatus(t("emptyReview"), true); return; }
    var ok = false;
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).catch(function () { fallbackCopy(); }); ok = true; } } catch (x) {}
    if (!ok) ok = fallbackCopy();
    setStatus(ok ? t("copiedPost") : t("copyFail"), !ok);
    track("review_copy_post", { copied: ok, edited: state.edited, details: Object.keys(state.rate).length, own_words: !!wordsBox.value.trim() });
    if (!ok) e.preventDefault();   // stay so they can copy by hand first
  });
  $("what").addEventListener("click", function (e) {
    var b = e.target.closest("[data-what]"); if (!b) return;
    var k = b.dataset.what;
    if (state.what[k]) delete state.what[k]; else state.what[k] = true;
    renderWhat(); renderAspects(); updateReview(); setStatus("");
  });
  $("aspects").addEventListener("click", function (e) {
    var b = e.target.closest("[data-aspect]"); if (!b) return;
    var a = b.dataset.aspect, v = b.dataset.v;
    if (state.rate[a] === v) delete state.rate[a]; else state.rate[a] = v;   // tap again to clear
    renderAspects(); updateReview(); setStatus("");
  });
  wordsBox.addEventListener("input", function () { updateReview(); setStatus(""); });
  reviewBox.addEventListener("input", function () {
    state.edited = reviewBox.value !== buildReview(state.lang);
    $("edited-note").hidden = !state.edited; $("rebuild").hidden = !state.edited;
    $("copy").setAttribute("aria-disabled", reviewBox.value.trim() ? "false" : "true");
    $("post").setAttribute("aria-disabled", reviewBox.value.trim() ? "false" : "true");
  });
  $("rebuild").addEventListener("click", function () { state.edited = false; updateReview(); setStatus(""); });

  function fallbackCopy() {
    try {
      reviewBox.focus(); reviewBox.select(); reviewBox.setSelectionRange(0, reviewBox.value.length);
      return document.execCommand && document.execCommand("copy");
    } catch (e) { return false; }
  }
  $("copy").addEventListener("click", function () {
    var text = reviewBox.value.trim();
    if (!text) { setStatus(t("emptyReview"), true); return; }
    var done = function () { setStatus(t("copied")); };
    var fail = function () { if (fallbackCopy()) done(); else setStatus(t("copyFail"), true); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
      else fail();
    } catch (e) { fail(); }
  });
  $("reset").addEventListener("click", function () {
    state.overall = null; state.what = {}; state.rate = {}; state.edited = false; wordsBox.value = ""; setStatus(""); renderAll();
    window.scrollTo(0, 0);
  });

  renderAll();
})();
</script>
</body>
</html>
